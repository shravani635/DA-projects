<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Executive Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow-x: hidden;
      color: #fff;
      background: #07111f;
    }

    /* Animated gradient background */
    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 198, 255, 0.28), transparent 28%),
        radial-gradient(circle at 85% 25%, rgba(124, 58, 237, 0.30), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.20), transparent 32%),
        linear-gradient(135deg, #06101d, #101b3a 48%, #071522);
      background-size: 180% 180%;
      animation: gradientMove 14s ease-in-out infinite alternate;
    }

    .background::before,
    .background::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      animation: float 12s ease-in-out infinite;
    }

    .background::before {
      top: 8%;
      left: -120px;
      background: #00c6ff;
    }

    .background::after {
      right: -120px;
      bottom: 5%;
      background: #8b5cf6;
      animation-delay: -5s;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 20%; }
      50% { background-position: 100% 80%; }
      100% { background-position: 20% 100%; }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(70px, -45px) scale(1.12); }
    }

    /* Floating particles */
    .particles {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      box-shadow: 0 0 14px rgba(125,211,252,.9);
      animation: rise linear infinite;
    }

    .particle:nth-child(1) { left: 8%; animation-duration: 12s; animation-delay: -2s; }
    .particle:nth-child(2) { left: 18%; animation-duration: 16s; animation-delay: -8s; }
    .particle:nth-child(3) { left: 31%; animation-duration: 13s; animation-delay: -4s; }
    .particle:nth-child(4) { left: 46%; animation-duration: 18s; animation-delay: -12s; }
    .particle:nth-child(5) { left: 61%; animation-duration: 14s; animation-delay: -6s; }
    .particle:nth-child(6) { left: 73%; animation-duration: 17s; animation-delay: -10s; }
    .particle:nth-child(7) { left: 86%; animation-duration: 11s; animation-delay: -3s; }
    .particle:nth-child(8) { left: 94%; animation-duration: 15s; animation-delay: -7s; }

    @keyframes rise {
      0% { transform: translateY(110vh) scale(.5); opacity: 0; }
      15% { opacity: .8; }
      80% { opacity: .5; }
      100% { transform: translateY(-15vh) scale(1.2); opacity: 0; }
    }

    .page {
      width: min(1500px, 94vw);
      margin: 0 auto;
      padding: 28px 0 36px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
      padding: 20px 24px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 22px;
      background: rgba(7, 18, 35, .60);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    .title-area h1 {
      font-size: clamp(25px, 3vw, 40px);
      letter-spacing: .5px;
      background: linear-gradient(90deg, #fff, #7dd3fc, #c4b5fd);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .title-area p {
      margin-top: 6px;
      color: #b7c7dc;
      font-size: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border-radius: 999px;
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(52,211,153,.28);
      color: #a7f3d0;
      font-size: 13px;
      white-space: nowrap;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 15px #34d399;
      animation: pulse 1.7s infinite;
    }

    @keyframes pulse {
      50% { transform: scale(1.45); opacity: .55; }
    }

    .dashboard-shell {
      position: relative;
      padding: 10px;
      border-radius: 25px;
      background: linear-gradient(135deg,
        rgba(56,189,248,.45),
        rgba(139,92,246,.30),
        rgba(255,255,255,.08));
      box-shadow:
        0 25px 70px rgba(0,0,0,.38),
        0 0 50px rgba(56,189,248,.10);
    }

    .dashboard-inner {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #fff;
      min-height: 760px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 760px;
      border: 0;
    }

    .shine {
      position: absolute;
      top: 0;
      left: -35%;
      width: 22%;
      height: 100%;
      transform: skewX(-18deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.10),
        transparent
      );
      animation: shine 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0%, 65% { left: -35%; }
      100% { left: 125%; }
    }

    .footer {
      text-align: center;
      color: #8ea2bc;
      font-size: 12px;
      margin-top: 16px;
    }

    @media (max-width: 700px) {
      .page { width: 96vw; padding-top: 14px; }
      .header { align-items: flex-start; flex-direction: column; }
      .status { align-self: flex-start; }
      .dashboard-inner { min-height: 650px; }
      iframe { height: 650px; }
    }
  </style>
</head>

<body>
  <div class="background"></div>

  <div class="particles" aria-hidden="true">
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
  </div>

  <main class="page">
    <header class="header">
      <div class="title-area">
        <h1>Sales Executive Dashboard</h1>
        <p>Interactive sales performance &amp; business analytics</p>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        Live Dashboard
      </div>
    </header>

    <section class="dashboard-shell">
      <div class="dashboard-inner">
        <iframe
          title="Sales Executive"
          src="https://app.powerbi.com/view?r=eyJrIjoiNDM1NWMyYzUtYjI2OC00OWFjLWI0YzgtMjBkNDdmODU1YzI0IiwidCI6IjVmOTA5NjYwLWUxMDQtNDNkNC1hOGViLTA2YjNjNTkxYjBiMSJ9"
          allowfullscreen="true">
        </iframe>
        <div class="shine"></div>
      </div>
    </section>

    <div class="footer">
      Sales Executive Analytics • Power BI Dashboard
    </div>
  </main>
</body>
</html>
